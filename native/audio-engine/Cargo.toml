[package]
name = "wavr-pulse"
version = "0.1.0"
edition = "2024"
rust-version = "1.85"

[dependencies]
anyhow = "1"
crossbeam-channel = "0.5"
reqwest = { version = "0.12", features = ["blocking"] }
rubato = "0.16"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
symphonia = { version = "0.6.1", features = ["all"] }
tempfile = "3"

[target.'cfg(windows)'.dependencies]
wasapi = "0.26"

[target.'cfg(target_os = "linux")'.dependencies]
cpal = "0.16"
pipewire = "0.10"
spa_sys = { package = "libspa-sys", version = "0.10" }

[build-dependencies]
serde_json = "1"

[profile.release]
lto = "thin"
codegen-units = 1
strip = true
